name: check

# What can be proved without a Claude Code installation and without spending on models: the types,
# the suite, the packaged artifact and its file list. The certification matrix needs an installed
# CLI, an authenticated account and real models, so it stays a deliberate act on a real machine and
# is recorded in documentation/certification-*.json rather than asserted here. A pipeline that
# claimed to certify what it cannot run would be the exact failure this product exists to refuse.

on:
  push:
    branches: [main]
    tags: ["cycle--v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A build provenance attestation for the archive a release publishes: it binds those exact bytes to
  # this workflow, this commit and this run, and `gh attestation verify` checks it from outside
  # without trusting anyone's key. It earns its place because the archive is reproducible — packaging
  # 1.0.19 on Windows and in WSL produced the same digest byte for byte — so a third party can
  # rebuild it and compare rather than take the attestation's word for it. Tags only: an attestation
  # for a commit nobody can install is noise.
  provenance:
    if: startsWith(github.ref, 'refs/tags/cycle--v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run package

      # The digest the marketplace pins is the digest this attests. If packaging here produced
      # different bytes than the release carries, the attestation would name bytes nobody installs,
      # so the two are compared rather than assumed equal.
      - name: the packaged archive matches what the marketplace pins
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls build/cycle-*.zip)"
          built="$(sha256sum "$archive" | cut -d' ' -f1)"
          pinned="$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].source.sha256")"
          echo "built  $built"
          echo "pinned $pinned"
          [ "$built" = "$pinned" ] || { echo "the marketplace pins a digest this build does not produce" >&2; exit 1; }

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/cycle-*.zip

  check:
    strategy:
      fail-fast: false
      matrix:
        # Both platforms the certification matrix covers. The store is built on node:sqlite and the
        # suite runs TypeScript directly, so the Node version is a floor, not a preference.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: package
        run: npm run package

      # The artifact is the thing users install, so what it contains is checked rather than assumed.
      - name: the artifact carries its licences and no tests
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls build/cycle-*.zip)"
          list="$(unzip -Z1 "$archive")"
          for required in LICENSE NOTICE THIRD-PARTY-NOTICES.md .claude-plugin/plugin.json; do
            echo "$list" | grep -qx "$required" || { echo "missing from the artifact: $required" >&2; exit 1; }
          done
          if echo "$list" | grep -Eq '(^|/)tests?/|\.test\.|\.map$'; then
            echo "the artifact contains tests or source maps" >&2
            exit 1
          fi
          echo "$archive: $(echo "$list" | wc -l) files, licences present, no tests"

      - name: record the artifact digest
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls build/cycle-*.zip)"
          sha256sum "$archive" | tee "$archive.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cycle-${{ matrix.os }}
          path: |
            build/cycle-*.zip
            build/cycle-*.zip.sha256
          if-no-files-found: error

  # `engines` names the oldest Node the shipped runtime supports, and node:sqlite is what sets it:
  # the module is unflagged only from 22.13.0. A floor nothing ever runs on is a claim, so the built
  # server is loaded on exactly that version here.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build

      - name: the shipped runtime loads on the oldest supported Node
        run: node --input-type=module -e "await import('./dist/store/database.js'); console.log('node:sqlite is available unflagged')"
